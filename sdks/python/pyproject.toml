[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crdtsync"
version = "0.0.0"
description = "Python bindings for the crdtsync CRDT core, over its C ABI."
requires-python = ">=3.8"
readme = "README.md"

[tool.setuptools]
packages = ["crdtsync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The provider suite drives real sockets and background threads, so a regression
# that leaves two sides waiting on each other must fail the run rather than hang
# it. Needs pytest-timeout; without it the setting is ignored.
timeout = 120
